name: Build Tech Reward APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)
          echo "SDKMANAGER=$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> $GITHUB_PATH

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)
          yes | "$SDKMANAGER" --licenses || true

      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Extract project ZIP
        run: |
          rm -rf project
          mkdir project
          unzip -q tech-reward.zip -d project

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          unzip -q gradle-9.3.1-bin.zip
          echo "$PWD/gradle-9.3.1/bin" >> $GITHUB_PATH

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tech-Reward-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
